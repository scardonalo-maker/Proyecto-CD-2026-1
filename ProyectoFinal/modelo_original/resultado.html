<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">
    <div class="card p-4 shadow">

        <h2>Resultado de la Predicción</h2>

        <h5 class="mt-4">KNN</h5>
        <h3 id="resultado-knn"></h3>

        <h5 class="mt-4">MLP</h5>
        <h3 id="resultado-mlp"></h3>

        <a href="index.html" class="btn btn-secondary mt-3">Volver</a>

    </div>
</div>

<script>
    document.getElementById("resultado-knn").innerText = localStorage.getItem("knn_prediccion") + " (" + (parseFloat(localStorage.getItem("knn_probabilidad")) * 100).toFixed(2) + "%)";
    document.getElementById("resultado-mlp").innerText = localStorage.getItem("mlp_prediccion") + " (" + (parseFloat(localStorage.getItem("mlp_probabilidad")) * 100).toFixed(2) + "%)";
</script>

</body>
</html>
