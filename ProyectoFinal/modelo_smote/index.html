<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Predicción de Depresión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="text-center mb-4">Formulario de Evaluación (Modelo balanceado)</h2>

        <form id="formulario">

            <div class="mb-3">
                <label>Edad</label>
                <input type="number" class="form-control" id="edad" min="0" required>
            </div>

            <div class="mb-3">
                <label>Género</label>
                <select class="form-control" id="genero" required>
                    <option value="">Seleccione</option>
                    <option value="Male">Masculino</option>
                    <option value="Female">Femenino</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Departamento</label>
                    <select class="form-control" id="departamento" required>
                        <option value="">Seleccione</option>
                        <option value="Engineering">Ingeniería</option>
                        <option value="Science">Ciencias</option>
                        <option value="Arts">Artes</option>
                        <option value="Business">Negocios</option>
                    </select>
            </div>

            <div class="mb-3">
                <label>Promedio académico (CGPA)</label>
                <input type="number" step="0.01" class="form-control" id="cgpa" min="0" max="5" required>
            </div>

            <div class="mb-3">
                <label>Horas de sueño</label>
                <input type="number" class="form-control" id="sueno" min="0" required>
            </div>

            <div class="mb-3">
                <label>Horas de estudio</label>
                <input type="number" class="form-control" id="estudio" min="0" required>
            </div>

            <div class="mb-3">
                <label>Horas en redes sociales</label>
                <input type="number" class="form-control" id="redes" min="0" required>
            </div>

            <div class="mb-3">
                <label>Actividad física (minutos/semana)</label>
                <input type="number" class="form-control" id="actividad" min="0" required>
            </div>

            <div class="mb-3">
                <label>Nivel de estrés (1-10)</label>
                <input type="number" class="form-control" id="estres" min="1" max="10" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">
                Predecir
            </button>

        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
