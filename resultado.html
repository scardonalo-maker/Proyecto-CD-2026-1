<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">
    <div class="card p-4 shadow">

        <h2>Resultado de la Predicción</h2>

        <h1 id="resultado" class="mt-4"></h1>

        <a href="index.html" class="btn btn-secondary mt-3">Volver</a>

    </div>
</div>

<script>
    let resultado = localStorage.getItem("prediccion");

    let texto = document.getElementById("resultado");

    if(resultado === "true"){
        texto.innerHTML = "⚠️ Posible Depresión";
        texto.classList.add("text-danger");
    } else {
        texto.innerHTML = "✅ No presenta depresión";
        texto.classList.add("text-success");
    }
</script>

</body>
</html>
